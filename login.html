<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Kembang Flower</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-box h2 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .auth-btn {
            width: 100%;
            margin-top: 10px;
        }

        .auth-link {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .auth-link a {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="header-wrapper">
        <div class="container">
            <div class="regs">
                <a href="index.html" class="logo">
                    <img src="assets/images/icon.png" alt="icon">
                </a>
                <div class="reg-links">
                    <div class="auth-links">
                        <a class="in" href="index.html">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container auth-container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn auth-btn">Sign In</button>
            </form>
            <span class="auth-link">Don't have an account? <a href="signup.html">Sign Up</a></span>
        </div>
    </div>
</body>

</html>
